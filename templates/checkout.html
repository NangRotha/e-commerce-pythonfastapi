{% extends "base.html" %}

{% block content %}
<h1 class="text-3xl font-bold text-gray-800 mb-8">Checkout</h1>

<div class="grid grid-cols-1 md:grid-cols-2 gap-8">
    <div class="bg-white rounded-lg shadow-md p-6">
        <h2 class="text-xl font-bold text-gray-800 mb-4">Order Summary</h2>
        <div class="space-y-4">
            {% for item in cart_items %}
            <div class="flex justify-between">
                <span>{{ item.product.name }} x {{ item.quantity }}</span>
                <span>${{ "%.2f"|format(item.quantity * item.product.price) }}</span>
            </div>
            {% endfor %}
            <div class="border-t pt-4">
                <div class="flex justify-between font-bold">
                    <span>Total</span>
                    <span>${{ "%.2f"|format(total) }}</span>
                </div>
            </div>
        </div>
    </div>
    
    <div class="bg-white rounded-lg shadow-md p-6">
        <h2 class="text-xl font-bold text-gray-800 mb-4">Shipping Information</h2>
        <form action="/checkout" method="post">
            <div class="mb-4">
                <label for="shipping_address" class="block text-gray-700 text-sm font-bold mb-2">Shipping Address</label>
                <textarea name="shipping_address" id="shipping_address" rows="4" required
                          class="w-full px-3 py-2 border border-gray-300 rounded focus:outline-none focus:border-blue-500"></textarea>
            </div>
            
            <button type="submit" class="w-full bg-blue-500 text-white font-bold py-2 px-4 rounded hover:bg-blue-600">
                Place Order
            </button>
        </form>
    </div>
</div>
{% endblock %}
