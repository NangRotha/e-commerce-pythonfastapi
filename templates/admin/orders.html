{% extends "base.html" %}

{% block content %}
<h1 class="text-3xl font-bold text-gray-800 mb-8">Manage Orders</h1>

<div class="bg-white rounded-lg shadow-md overflow-hidden">
    <div class="overflow-x-auto">
        <table class="w-full">
            <thead class="bg-gray-50">
                <tr>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Order ID</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Customer</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Total</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Status</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Date</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Actions</th>
                </tr>
            </thead>
            <tbody class="divide-y divide-gray-200">
                {% for order in orders %}
                <tr>
                    <td class="px-6 py-4">#{{ order.id }}</td>
                    <td class="px-6 py-4">{{ order.user.username }}</td>
                    <td class="px-6 py-4">${{ "%.2f"|format(order.total_amount) }}</td>
                    <td class="px-6 py-4">
                        <form action="/admin/orders/update/{{ order.id }}" method="post" class="inline">
                            <select name="status" onchange="this.form.submit()" 
                                    class="px-2 py-1 border rounded text-sm">
                                <option value="pending" {% if order.status == 'pending' %}selected{% endif %}>Pending</option>
                                <option value="paid" {% if order.status == 'paid' %}selected{% endif %}>Paid</option>
                                <option value="shipped" {% if order.status == 'shipped' %}selected{% endif %}>Shipped</option>
                                <option value="delivered" {% if order.status == 'delivered' %}selected{% endif %}>Delivered</option>
                            </select>
                        </form>
                    </td>
                    <td class="px-6 py-4">{{ order.created_at.strftime('%Y-%m-%d %H:%M') }}</td>
                    <td class="px-6 py-4">
                        <button onclick="viewOrder({{ order.id }})" class="text-blue-500 hover:text-blue-700">
                            View Details
                        </button>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>

<script>
function viewOrder(orderId) {
    alert('Order details feature coming soon!');
}
</script>
{% endblock %}
